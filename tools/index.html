<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Stack</title>
  <meta name="description" content="Browse AI tools by use case in the Signal Stack directory.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://signal-stack-dylan2045ad.vercel.app/">
  <meta http-equiv="refresh" content="0; url=https://signal-stack-dylan2045ad.vercel.app/">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050819;
      --panel: #0a1130;
      --text: #e9edf7;
      --accent: #63f5c7;
      --muted: #aab5d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top, #12215a 0, var(--bg) 58%);
      color: var(--text);
      font: 500 1rem/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(42rem, 100%);
      padding: clamp(1.75rem, 5vw, 3rem);
      border: 1px solid rgba(99, 245, 199, .45);
      border-radius: 1.25rem;
      background: var(--panel);
      box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .45);
      text-align: center;
    }
    h1 { margin: 0 0 .75rem; color: var(--accent); font-size: clamp(2rem, 7vw, 3.5rem); }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    a {
      display: inline-block;
      padding: .8rem 1.15rem;
      border-radius: 999px;
      background: var(--accent);
      color: #03110d;
      font-weight: 800;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Signal Stack</h1>
    <p>Opening the AI tools directory by use case.</p>
    <a href="https://signal-stack-dylan2045ad.vercel.app/">Continue to Signal Stack</a>
  </main>
</body>
</html>
