name: Update Podcast Oct 20 (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap podcast episodes in index.html
        run: |
          python3 - <<'PYEOF'
          p = "index.html"
          s = open(p, encoding="utf-8").read()
          ID18 = "6BvbipAx2xj86J34hv15Ss"
          D18 = "October 18, 2026"
          T18 = "Three Aurora Alphas Spotted — OpenAI's Mystery Red, Green and Blue Models"
          ID16 = "028VDWsCjaC5FgztSHdnYF"
          D16 = "October 16, 2026"
          T16 = "Meta Opens the Weights Again — Muse Spark Open and the Distribution Race"
          IDN = "0plZ8qsniHAsHkDQ8UKwDL"
          DN = "October 20, 2026"
          TN = "One Line of Code Against the CUDA Moat — AWS TorchNeuron Opens Trainium to Every PyTorch Team"
          assert s.count(ID18) == 2 and s.count(D18) == 3 and s.count(T18) == 2
          assert s.count(ID16) == 2 and s.count(D16) == 3 and s.count(T16) == 2
          assert s.count(IDN) == 0 and s.count(DN) == 0 and s.count(TN) == 0
          s = s.replace(ID18, "ZZNEWIDZZ").replace(D18, "ZZNEWDATEZZ").replace(T18, "ZZNEWTITLEZZ")
          s = s.replace(ID16, ID18).replace(D16, D18).replace(T16, T18)
          s = s.replace("ZZNEWIDZZ", IDN).replace("ZZNEWDATEZZ", DN).replace("ZZNEWTITLEZZ", TN)
          assert s.count(IDN) == 2 and s.count(DN) == 3 and s.count(TN) == 2
          assert s.count(ID16) == 0 and s.count(D16) == 0 and s.count(T16) == 0
          assert s.count(ID18) == 2 and s.count(D18) == 3 and s.count(T18) == 2
          assert "4fRcVeqEd2lLu9o3M3dzvN" in s
          open(p, "w", encoding="utf-8").write(s)
          print("podcast section updated")
          PYEOF
      - name: Commit and push to main
        run: |
          git config user.name "Dylan"
          git config user.email "dylan2045ad@users.noreply.github.com"
          git rm -q .github/workflows/update-podcast-oct20.yml
          git add -A
          git commit -m "Add Oct 20 Futurenomics episode to Podcast section [skip netlify]"
          git push origin HEAD:main
