<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Audiowide&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cyan:#00e8ff;--magenta:#ff2bd6;--text:#e8eaf8;--muted:rgba(232,234,248,.78)}
body{background:linear-gradient(160deg,#020208 0%,#0a0520 45%,#05050c 100%);background-attachment:fixed;color:var(--text);font-family:'Orbitron',system-ui,sans-serif;min-height:100vh;line-height:1.6;padding:64px 18px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px;text-align:center;align-items:center}
h1{font-family:'Audiowide','Orbitron',sans-serif;font-weight:400;font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 18px rgba(0,232,255,.55),0 0 40px rgba(255,43,214,.28)}
p{font-size:.9rem;font-weight:400;color:var(--muted);max-width:480px}
a.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 30px;border-radius:12px;margin-top:8px;font-size:.85rem;font-weight:800;letter-spacing:.12em;text-decoration:none;text-transform:uppercase;color:#05050c;border:2px solid transparent;background:linear-gradient(135deg,#00e8ff 0%,#5af0ff 45%,#b8f8ff 100%);box-shadow:0 6px 24px rgba(0,232,255,.45);transition:transform .18s ease}
a.btn:hover{transform:translateY(-2px)}
a.home{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);text-decoration:none}
a.home:hover{color:#fff}
</style>
</head>
